<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="900" height="700" fill="#faf6ee"/>

  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a2c1a">Galle — concession sédentaire (schéma de synthèse, non validé sur le terrain)</text>

  <!-- Limite de la concession -->
  <ellipse cx="450" cy="390" rx="330" ry="250" fill="none" stroke="#8a6a3a" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="450" y="655" text-anchor="middle" font-size="14" fill="#8a6a3a">limite de la concession (mur de banco) — tracé indicatif</text>

  <!-- Zone publique / masculine (proche entrée, bas) -->
  <ellipse cx="450" cy="560" rx="230" ry="90" fill="#e8d9b5" opacity="0.6"/>
  <text x="450" y="470" text-anchor="middle" font-size="13" font-style="italic" fill="#6b5433">zone d'entrée — publique / masculine</text>

  <!-- Zone privée / féminine (fond) -->
  <ellipse cx="450" cy="300" rx="260" ry="150" fill="#d7e4c8" opacity="0.6"/>
  <text x="450" y="175" text-anchor="middle" font-size="13" font-style="italic" fill="#4b6b33">zone intérieure — privée / féminine</text>

  <!-- Entrée -->
  <rect x="420" y="635" width="60" height="14" fill="#3a2c1a"/>
  <text x="450" y="620" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a2c1a">Entrée</text>

  <!-- Suudu hobbe (case d'hote) -->
  <circle cx="330" cy="555" r="42" fill="#c9a876" stroke="#6b5433" stroke-width="2"/>
  <text x="330" y="551" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a2c1a">suudu hoɓɓe</text>
  <text x="330" y="567" text-anchor="middle" font-size="11" fill="#3a2c1a">case d'hôte</text>

  <!-- Dudal -->
  <circle cx="570" cy="555" r="42" fill="#e0c48f" stroke="#6b5433" stroke-width="2"/>
  <text x="570" y="551" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a2c1a">dudal</text>
  <text x="570" y="567" text-anchor="middle" font-size="10" fill="#3a2c1a">prière / feu (voir note)</text>

  <!-- Cases des epouses (3, scope reduit) -->
  <circle cx="330" cy="290" r="48" fill="#b8956a" stroke="#6b5433" stroke-width="2"/>
  <text x="330" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">case épouse 1</text>

  <circle cx="450" cy="220" r="48" fill="#b8956a" stroke="#6b5433" stroke-width="2"/>
  <text x="450" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">case épouse 2</text>

  <circle cx="570" cy="290" r="48" fill="#b8956a" stroke="#6b5433" stroke-width="2"/>
  <text x="570" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">case épouse 3</text>

  <!-- Foyer / cuisine -->
  <circle cx="450" cy="330" r="26" fill="#d9663b" stroke="#7a2f14" stroke-width="2"/>
  <text x="450" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">foyer</text>

  <!-- Grenier -->
  <rect x="220" y="190" width="60" height="60" rx="8" fill="#8a9e5e" stroke="#4b6b33" stroke-width="2"/>
  <text x="250" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">grenier</text>

  <!-- Hoggo (enclos betail) exterieur -->
  <rect x="640" y="140" width="180" height="110" rx="10" fill="none" stroke="#5a4a2a" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="730" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a2c1a">hoggo</text>
  <text x="730" y="200" text-anchor="middle" font-size="11" fill="#3a2c1a">enclos à bétail</text>
  <text x="730" y="216" text-anchor="middle" font-size="10" fill="#3a2c1a">(hors mur, périphérie)</text>

  <!-- Nord hypothetique -->
  <g transform="translate(90,80)">
    <line x1="0" y1="40" x2="0" y2="0" stroke="#3a2c1a" stroke-width="2"/>
    <polygon points="0,0 -6,12 6,12" fill="#3a2c1a"/>
    <text x="0" y="58" text-anchor="middle" font-size="12" fill="#3a2c1a">N ?</text>
    <text x="0" y="72" text-anchor="middle" font-size="9" fill="#8a6a3a">orientation non confirmée</text>
  </g>

  <!-- Legende -->
  <g transform="translate(40,600)">
    <rect x="0" y="0" width="18" height="18" fill="#e8d9b5" opacity="0.8"/>
    <text x="24" y="14" font-size="12" fill="#3a2c1a">zone publique / masculine</text>
    <rect x="0" y="24" width="18" height="18" fill="#d7e4c8" opacity="0.8"/>
    <text x="24" y="38" font-size="12" fill="#3a2c1a">zone privée / féminine</text>
  </g>
</svg>
